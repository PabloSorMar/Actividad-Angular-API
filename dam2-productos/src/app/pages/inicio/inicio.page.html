<ion-header>
  <ion-toolbar>
    <ion-title>
      Inicio
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleTheme()" fill="clear">
        {{ isDarkMode ? '☀️ Claro' : '🌙 Oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>DAM2 - API REST</h1>
  <p>
    Aplicación Ionic + Angular Standalone
    para consumir una API REST.
  </p>

  <div class="actions">
    <ion-button routerLink="/productos">
      Ver productos
    </ion-button>
    <ion-button routerLink="/about" fill="outline">
      About
    </ion-button>
    <ion-button (click)="toggleTheme()" fill="outline" color="medium">
      {{ isDarkMode ? '☀️ Desactivar Modo Oscuro' : '🌙 Activar Modo Oscuro' }}
    </ion-button>
  </div>
</ion-content>
